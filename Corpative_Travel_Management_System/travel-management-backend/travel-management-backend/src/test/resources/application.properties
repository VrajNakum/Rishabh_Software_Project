# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:travel_management_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.seed.demo-data=true
app.seed.default-password=TestSeed@123
app.jwt.secret=TestSecretKeyForCorporateTravelManagementSystem2026JwtSigning!
app.jwt.expiration-ms=86400000

