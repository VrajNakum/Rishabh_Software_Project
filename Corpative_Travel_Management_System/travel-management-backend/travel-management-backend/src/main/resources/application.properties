# ===================================================================
# Server Port Configuration
# ===================================================================
server.port=8080

# ===================================================================
# Primary Database Configuration: PostgreSQL
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5080/travel_management_db
spring.datasource.username=postgres
spring.datasource.password=vrajnakum
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open-In-View (Best practice to prevent lazy loading leaks outside transactions)
spring.jpa.open-in-view=false

# H2 Web Console (Optional diagnostic viewer at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
