# ===================================================================
# Server Port Configuration
# ===================================================================
server.port=8080

# ===================================================================
# Primary Database Configuration: PostgreSQL
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5080/travel_management_db
spring.datasource.username=postgres
spring.datasource.password=vrajnakum
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open-In-View (Best practice to prevent lazy loading leaks outside transactions)
spring.jpa.open-in-view=false

# H2 Web Console (Optional diagnostic viewer at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# Optional / Backup Database Profile: In-Memory H2
# Activate anytime by running with: --spring.profiles.active=h2
# ===================================================================
#---
spring.config.activate.on-profile=h2
spring.datasource.url=jdbc:h2:mem:travel_management_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
